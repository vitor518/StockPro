# ===== APLICA\u00c7\u00c3O =====
spring.application.name=StockPro
server.port=8080
spring.main.allow-bean-definition-overriding=true

# ===== BANCO DE DADOS (PostgreSQL) =====
# Note que alterei o final da URL para /ControleEstoque
spring.datasource.url=jdbc:postgresql://localhost:5432/ControleEstoque
spring.datasource.username=postgres
spring.datasource.password=17112007
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/HIBERNATE =====
# IMPORTANTE: Alterado de H2Dialect para PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ===== CONSOLE H2 (Desativado pois voc\u00ea usar\u00e1 SQL f\u00edsico) =====
spring.h2.console.enabled=false

# ===== SWAGGER/OPENAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== SEGURAN\u00c7A JWT =====
jwt.secret=${JWT_SECRET:StockPro2024SecretKeyMuitoSeguraParaDesenvolvimento}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== JACKSON (JSON) =====
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== LOGGING =====
logging.level.root=INFO
logging.level.br.ifsp.stockpro=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== PROFILE ATIVO =====
spring.profiles.active=dev

# ===== SEEDER =====
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin123}

# ===== CONFIGURA\u00c7\u00c3O DE E-MAIL (SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-aplicativo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true