# ===== APLICAÇÃO =====
spring.application.name=StockPro
server.port=8080

# ===== BANCO DE DADOS =====
# H2 - Desenvolvimento
spring.datasource.url=jdbc:h2:mem:stockprodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL - Produção (comentado, descomentar ao usar)
#spring.datasource.url=jdbc:postgresql://localhost:5432/stockprodb
#spring.datasource.username=postgres
#spring.datasource.password=senha123
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ===== CONSOLE H2 =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== SWAGGER/OPENAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== SEGURANÇA JWT =====
jwt.secret=${JWT_SECRET:StockPro2024SecretKeyMuitoSeguraParaDesenvolvimento}
jwt.expiration=${JWT_EXPIRATION:86400000}
# 86400000ms = 24 horas

# ===== JACKSON (JSON) =====
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===== UPLOAD DE ARQUIVOS (Futuramente) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== EMAIL (Opcional) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:seu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha-app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== CACHE (Performance) =====
spring.cache.type=simple

# ===== LOGGING =====
logging.level.root=INFO
logging.level.br.ifsp.stockpro=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== PROFILE ATIVO =====
spring.profiles.active=dev

# ===== SEEDER =====
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin123}
